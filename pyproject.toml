readme = "README.md"
authors = [
    { name = "Rashed J", email = "60935992+rashid7089@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "evidently>=0.7.21",
    "fastapi>=0.140.13",
    "joblib>=1.5.3",
    "mlflow>=3.14.0",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
